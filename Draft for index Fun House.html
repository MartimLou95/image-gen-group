
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun House AI Image Generator</title>
    <link rel="stylesheet" href="Draft for CSS Fun House.css">
</head>
<body>

    <header>
        <h1> Fun House Image Generator </h1>
        <p>Step right in! Upload an image and transform it into a wild new art style!</p>
    </header>

    <section class="upload-section">
        <h2>Upload Your Image</h2>
        <input type="file" accept="image/*">
        <button>Generate Style</button>
    </section>

    <section class="styles-section">
        <h2>Pick Your Style!</h2>

        <div class="styles-grid">

            <div class="style-card">
                <img src="images/ghibli.jpg" alt="Studio Ghibli Example">
                <h3>Studio Ghibli</h3>
            </div>

            <div class="style-card">
                <img src="images/disney.jpg" alt="Disney Style Inspired Example">
                <h3>Disney Style Inspired</h3>
            </div>

            <div class="style-card">
                <img src="images/anime.jpg" alt="Anime Example">
                <h3>Anime</h3>
            </div>

            <div class="style-card">
                <img src="images/cyberpunk.jpg" alt="Cyberpunk Example">
                <h3>Cyberpunk</h3>
            </div>

            <div class="style-card">
                <img src="images/oilpainting.jpg" alt="Oil Painting Example">
                <h3>Oil Painting</h3>
            </div>

            <div class="style-card">
                <img src="images/pixelart.jpg" alt="Pixel Art Example">
                <h3>Pixel Art</h3>
            </div>

        </div>
    </section>

</body>
</html>
