<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>AI Art Converter</h1>
      <p>Upload an image and transform it into AI slop!</p>

      <div class="form-group">
        <label for="imageUpload">Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*" />
      </div>

      <div class="form-group">
        <label for="artStyle">Choose Art Style</label>
        <select id="artStyle">
          <option value="ghibli">Studio Ghibli</option>
          <option value="anime">Anime</option>
          <option value="disney">Disney</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="oil_painting">Oil Painting</option>
          <option value="pixel_art">Pixel Art</option>
        </select>
      </div>

      <div class="form-group">
        <label for="customStyle">Or describe your own style</label>
        <input
          type="text"
          id="customStyle"
          placeholder="e.g. a watercolour painting"
        />
      </div>

      <button class="convert-btn" onclick="convertImage()">
        Generate AI Art
      </button>

      <div class="status" id="status"></div>

      <div id="spinner" hidden>Loading...</div>

      <div class="compare" id="compare" hidden>
        <img id="originalImage" alt="Your original photo" />
        <img id="resultImage" alt="Your AI image" />
      </div>

      <input
        type="range"
        id="compareSlider"
        min="0"
        max="100"
        value="100"
        hidden
      />

      <a id="downloadLink" download="ai-art.png" hidden>Download image</a>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
