<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Art Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header>
        <h1>AI Art Converter</h1>
        <p>Step right in! Upload an image and transform it into a wild new art style!</p>
    </header>

    <div class="container">
      <h1>AI Art Converter</h1>
      <p>Upload an image and transform it into AI-generated artwork.</p>

      <div class="form-group">
        <label for="imageUpload">Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*" />
      </div>

      <div class="form-group">
        <label for="artStyle">Choose Art Style</label>
        <select id="artStyle">
          <option value="ghibli">Studio Ghibli</option>
          <option value="anime">Anime</option>
          <option value="disney">Disney</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="oil_painting">Oil Painting</option>
          <option value="pixel_art">Pixel Art</option>
        </select>
      </div>

      <section class="styles-section">
        <h2>Pick Your Style!</h2>
        <div class="styles-grid">

          <div class="style-card">
            <img src="images/ghibli.jpg" alt="Studio Ghibli Example">
            <h3>Studio Ghibli</h3>
          </div>

          <div class="style-card">
            <img src="images/disney.jpg" alt="Disney Style Inspired Example">
            <h3>Disney Style Inspired</h3>
          </div>

          <div class="style-card">
            <img src="images/anime.jpg" alt="Anime Example">
            <h3>Anime</h3>
          </div>

          <div class="style-card">
            <img src="images/cyberpunk.jpg" alt="Cyberpunk Example">
            <h3>Cyberpunk</h3>
          </div>

          <div class="style-card">
            <img src="images/oilpainting.jpg" alt="Oil Painting Example">
            <h3>Oil Painting</h3>
          </div>

          <div class="style-card">
            <img src="images/pixelart.jpg" alt="Pixel Art Example">
            <h3>Pixel Art</h3>
          </div>

        </div>
      </section>

      <button class="convert-btn" onclick="convertImage()">
        Generate AI Art
      </button>

      <div class="status" id="status"></div>

      <div class="preview">
        <img id="resultImage" alt="Your AI image" />
      </div>

    </div>

    <script src="js/script.js"></script>
  </body>
</html>
